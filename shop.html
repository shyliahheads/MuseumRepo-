<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Museum Souvenir Shop</title>

<link rel="stylesheet" href="../css/styles.css">

<style>
body {
  font-family: Arial;
  background:#0c1b2a;
  color:white;
}

.shop-container {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:30px;
}

.souvenir-item {
  background:white;
  color:black;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.price { font-weight:bold; }

button {
  padding:10px;
  background:#0a5c91;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Museum Souvenir Shop</h1>

<nav>
<a href="index.html">Home</a>
<a href="collections.html">Collections</a>
<a href="shop.html">Shop</a>
<button onclick="location.href='cart.html'">View Cart</button>
</nav>

<div class="shop-container">

<!-- ITEM 1 -->
<div class="souvenir-item">
<img src="../images/starbone-totem.jpg" width="200">

<h3>Starbone Totem</h3>
<div class="price">$24.99</div>

<button
 onclick="addToCart(this)"
 data-id="item001"
 data-name="Starbone Totem"
 data-price="24.99"
 data-image="../images/starbone-totem.jpg">
 Add to Cart
</button>
</div>

<!-- ITEM 2 -->
<div class="souvenir-item">
<img src="../images/coral-incense.jpg" width="200">

<h3>Coral Queen Incense</h3>
<div class="price">$14.50</div>

<button
 onclick="addToCart(this)"
 data-id="item002"
 data-name="Coral Queen Incense"
 data-price="14.50"
 data-image="../images/coral-incense.jpg">
 Add to Cart
</button>
</div>

<!-- ITEM 3 -->
<div class="souvenir-item">
<img src="../images/tidecompass.jpg" width="200">

<h3>Ancient Tide Compass</h3>
<div class="price">$39.00</div>

<button
 onclick="addToCart(this)"
 data-id="item003"
 data-name="Ancient Tide Compass"
 data-price="39.00"
 data-image="../images/tidecompass.jpg">
 Add to Cart
</button>
</div>

<!-- ITEM 4 -->
<div class="souvenir-item">
<img src="../images/abyss-mask.jpg" width="200">

<h3>Abyss Ritual Mask</h3>
<div class="price">$52.75</div>

<button
 onclick="addToCart(this)"
 data-id="item004"
 data-name="Abyss Ritual Mask"
 data-price="52.75"
 data-image="../images/abyss-mask.jpg">
 Add to Cart
</button>
</div>

</div>

<script src="../js/cart.js"></script>

</body>
</html>
